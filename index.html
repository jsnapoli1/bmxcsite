<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Blue Mountain Cross Country Camp — Est. 1969</title>
    <meta
      name="description"
      content="The oldest and longest running XC summer camp in the Northeast. A sleepover running camp for students entering grades 7-12, held at Camp Westmont in the Pocono Mountains."
    />
    <meta name="theme-color" content="#12203a" />
    <link rel="canonical" href="https://bluemountainxccamp.com/" />

    <!-- Icons: the camp's own mark. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blue Mountain Cross Country Camp — Est. 1969" />
    <meta
      property="og:description"
      content="50+ years of great training, creating friends, strengthening teams, and tradition. August 16-22, 2026."
    />
    <meta property="og:site_name" content="Blue Mountain XC Camp" />
    <meta property="og:image" content="https://bmxcsite.simplifai-ai.workers.dev/bmxc-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://bmxcsite.simplifai-ai.workers.dev/bmxc-logo.png" />

    <!-- Fonts: preconnect, then load the stylesheet without blocking render.
         The media/onload swap lets the browser paint immediately; font-display:swap
         (in the Google CSS) handles the text handoff. A <noscript> copy keeps
         fonts working with JS disabled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
